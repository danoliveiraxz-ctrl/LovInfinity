<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LovInfinity Admin</title><link rel="stylesheet" href="admin.css"></head><body><main><header><div class="logo">∞</div><div><h1>LovInfinity Admin</h1><p>Licenciamento e infraestrutura</p></div></header><section id="auth" class="card"><h2>Acesso administrativo</h2><p>Entre com sua conta Supabase.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><div class="row"><button id="login">Entrar</button><button id="signup" class="ghost">Criar conta</button></div><div id="bootstrapBox" class="hidden"><hr><p>Primeiro administrador</p><input id="bootstrap" placeholder="Token de configuração inicial"><button id="bootstrapBtn">Tornar esta conta administradora</button></div><p id="authError" class="error"></p></section><section id="panel" class="hidden"><div class="top"><div><span class="pill">ADMINISTRADOR</span><h2>Licenças</h2></div><button id="logout" class="ghost small">Sair</button></div><div class="stats"><div><small>Total</small><b id="total">0</b></div><div><small>Ativas</small><b id="active">0</b></div><div><small>Expiradas</small><b id="expired">0</b></div><div><small>Revogadas</small><b id="revoked">0</b></div></div><div class="card"><h3>Gerar licença</h3><div class="row"><button data-duration="week">1 semana</button><button data-duration="month">1 mês</button><button data-duration="lifetime">Vitalícia</button></div><div id="newToken" class="token hidden"></div></div><div class="card"><h3>Licenças emitidas</h3><div class="tableWrap"><table><thead><tr><th>Token</th><th>Tipo</th><th>Criação</th><th>Expiração</th><th>Ativações</th><th>Status</th><th></th></tr></thead><tbody id="licenses"></tbody></table></div></div><div class="card"><h3>OpenAI</h3><p id="openaiStatus">Aguardando teste.</p><textarea id="aiInput" placeholder="Digite uma solicitação para testar a conexão..."></textarea><button id="aiTest">Testar conexão OpenAI</button><pre id="aiOutput"></pre></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
